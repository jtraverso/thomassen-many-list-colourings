      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Wrote the Lean development (directory ThomassenManyColourings/), the Challenge/Solution
        pair and the packaging under the author's direction, checked with lake build, #print
        axioms and a comparison of the elaborated Challenge and Solution statements and
        definitions (pp.all) (Lean v4.35.0-rc3, Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "a few days"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The result was chosen by the human author; the Lean development is AI-written under the
    author's direction and mechanically verified: no sorry, axioms limited to propext,
    Classical.choice and Quot.sound, identical elaborated statements and definitions in the
    Challenge and the Solution.

fidelity:
  divergences: >-
    Planar graphs are finite simple graphs on a Fintype vertex type with a combinatorial plane map
    (a genus-zero rotation system) instead of a drawing in the plane. Lists are Finsets over an
    arbitrary colour type; the number of list colourings is Set.ncard of the set of maps V → C
    choosing from the lists and proper on the edges. The bound 2^{n/9} is a real power. Theorems
    1–4 are stated in the library for an abstract interface of near-triangulations and are not
    part of the compared statements.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent compared
    the statement with the abstract and Section 6 of the paper, checked the definition of
    planarity against the registered entry it is copied from, and checked the degenerate cases (no
    vertex, one vertex, two vertices, disconnected graphs). The author directed the work and chose
    the result. No independent human review of the formalization has been performed. The result
    is published; no mathematical novelty is claimed.

